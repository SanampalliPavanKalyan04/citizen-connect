databases:
  - name: citizen-connect-db
    plan: free
    databaseName: citizen_connect
    user: citizen_connect

services:
  - type: web
    name: citizen-connect
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: citizen-connect-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "false"
      # Render asks you to type these when you create the Blueprint
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
